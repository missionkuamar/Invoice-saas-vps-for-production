version: '3.8'

services:
  server:
    build: ./server
    container_name: invoice-server
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    volumes:
      - uploads-data:/app/uploads
    networks:
      - invoice-net

  client:
    build: ./client
    container_name: invoice-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - invoice-net

volumes:
  uploads-data:

networks:
  invoice-net:
    driver: bridge