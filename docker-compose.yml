

services:
  server:
    build: ./server
    container_name: invoice-server
    
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    restart: unless-stopped
    
    networks:
      - invoice-net

  client:
    build: ./client
    container_name: invoice-client
    
    ports:
      - "5174:3000"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - invoice-net

volumes:
  uploads-data:

networks:
  invoice-net:
    driver: bridge